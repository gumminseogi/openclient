name: OpenClient performance checks

on:
  workflow_dispatch:
  push:
    branches: [performance-lab]

permissions:
  contents: read

concurrency:
  group: openclient-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check synthetic server contracts
        run: python3 -B -m unittest discover -s performance-lab -p 'test_*.py' -v

  native:
    needs: fixture
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iphone, ipad]
    env:
      OPENCLIENT_DEVICE_KIND: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an available Pro Max or 13-inch iPad Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLIENT_RESULTS="$RUNNER_TEMP/openclient-results"
          printf 'OPENCLIENT_RESULTS=%s\n' "$OPENCLIENT_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$OPENCLIENT_RESULTS"
          xcode-select -p
          xcodebuild -version
          export OPENCLIENT_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if xcode-select -p | grep -Eiq 'beta|release.?candidate|_RC'; then
            echo 'The selected Xcode is prerelease; no simulator tests ran.' >&2
            exit 1
          fi
          xcrun simctl list devices available --json > "$OPENCLIENT_RESULTS/simulators.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          devices = json.loads((Path(os.environ['OPENCLIENT_RESULTS']) / 'simulators.json').read_text())['devices']
          patterns = {'iphone': r'^iPhone ([0-9]+) Pro Max$', 'ipad': r'^iPad Pro 13-inch \(M([0-9]+)\)$'}
          sdk = tuple(map(int, os.environ['OPENCLIENT_SDK_VERSION'].split('.')[:2]))
          common = []
          for runtime, rows in devices.items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'[0-9]+', runtime)))
              if version[:2] > sdk:
                  continue
              models = {kind: [device for device in rows if device.get('isAvailable')
                        and re.fullmatch(pattern, device['name'])
                        and (kind != 'iphone' or int(re.fullmatch(pattern, device['name']).group(1)) >= 16)]
                        for kind, pattern in patterns.items()}
              if all(models.values()):
                  common.append((version, runtime, models))
          if not common:
              raise SystemExit('No supported common runtime for Pro Max and 13-inch iPad Pro; native tests were not run.')
          _, runtime, models = max(common, key=lambda item: item[0])
          kind = os.environ['OPENCLIENT_DEVICE_KIND']
          device = max(models[kind], key=lambda device: int(re.fullmatch(patterns[kind], device['name']).group(1)))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('OPENCLIENT_DESTINATION=platform=iOS Simulator,id=' + device['udid'] + '\n')
          print('Selected simulator:', runtime, device['name'], device['udid'])
          PY
      - name: Run actual OpenClient Swift tests
        shell: bash
        run: bash performance-lab/run-native-tests.sh "$GITHUB_WORKSPACE" "$OPENCLIENT_DESTINATION" "$OPENCLIENT_RESULTS/native"
      - name: Run grouping UI and real ChatView smoke against the synthetic server
        if: success()
        shell: bash
        env:
          TEST_RUNNER_OPENCLIENT_LAB_UI_URL: http://127.0.0.1:14097
          TEST_RUNNER_OPENCLIENT_LAB_UI_PASSWORD: ci-fixture-only
          TEST_RUNNER_OPENCLIENT_LAB_UI_TARGET_LOADED: '80'
          TEST_RUNNER_OPENCLIENT_LAB_UI_MAX_SWIPES: '240'
        run: |
          set -euo pipefail
          cat performance-lab/long_transcript_ui.swift >> OpenCodeIOSClientUITests/ToolGroupingUITests.swift
          python3 -u performance-lab/lab.py serve \
            --port 14097 --password ci-fixture-only \
            --log "$OPENCLIENT_RESULTS/requests.jsonl" \
            > "$OPENCLIENT_RESULTS/fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import base64
          import json
          import time
          import urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          request = urllib.request.Request('http://127.0.0.1:14097/_lab/status', headers={
              'Authorization': 'Basic ' + base64.b64encode(b'opencode:ci-fixture-only').decode()})
          for attempt in range(50):
              try:
                  with opener.open(request, timeout=1) as response:
                      assert json.load(response)['synthetic'] is True
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Synthetic server did not become ready')
          PY
          xcodebuild -quiet \
            -project OpenCodeIOSClient.xcodeproj \
            -scheme OpenCodeIOSClient \
            -destination "$OPENCLIENT_DESTINATION" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$OPENCLIENT_RESULTS/native/DerivedData" \
            -resultBundlePath "$OPENCLIENT_RESULTS/grouping-ui.xcresult" \
            -only-testing:OpenCodeIOSClientUITests/ToolGroupingUITests \
            DEVELOPMENT_TEAM= \
            test 2>&1 | tee "$OPENCLIENT_RESULTS/grouping-ui.log"
      - name: Export readable test results and hang diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          results="${OPENCLIENT_RESULTS:-$RUNNER_TEMP/openclient-results}"
          mkdir -p "$results"
          for name in native/tests grouping-ui; do
            bundle="$results/$name.xcresult"
            if [[ -d "$bundle" ]]; then
              stem="${name//\//-}"
              xcrun xcresulttool get test-results summary --path "$bundle" > "$results/$stem-summary.json" || true
              xcrun xcresulttool get test-results tests --path "$bundle" > "$results/$stem-tests.json" || true
              xcrun xcresulttool export attachments --path "$bundle" --output-path "$results/$stem-attachments" || true
              cat "$results/$stem-summary.json"
            fi
          done
          if [[ -n "${OPENCLIENT_DESTINATION:-}" ]]; then
            device_id="${OPENCLIENT_DESTINATION##*id=}"
            xcrun simctl spawn "$device_id" log show --style json --last 45m \
              --predicate 'subsystem == "com.ntoporcov.openclient" AND (category == "Hangs" OR category == "SessionSwitch")' \
              > "$results/app-hangs.json" 2> "$results/app-hangs-export.log" || true
          fi
      - name: Keep environment, build logs and XCTest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclient-performance-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OPENCLIENT_RESULTS }}
            !${{ env.OPENCLIENT_RESULTS }}/native/DerivedData/**
          retention-days: 3
          if-no-files-found: warn
