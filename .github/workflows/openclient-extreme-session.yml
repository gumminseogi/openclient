name: OpenClient extreme session loading

on:
  push:
    branches: [extreme-session-lab]

permissions:
  contents: read

concurrency:
  group: openclient-extreme-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check synthetic session contracts
        run: python3 -B -m unittest discover -s performance-lab -p 'test_*.py' -v

  native:
    needs: fixture
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iphone, ipad]
    env:
      OPENCLIENT_DEVICE_KIND: ${{ matrix.device }}
      OPENCLIENT_EXTREME_MESSAGES: '5000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an available Pro Max or 13-inch iPad Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLIENT_RESULTS="$RUNNER_TEMP/openclient-extreme-results"
          printf 'OPENCLIENT_RESULTS=%s\n' "$OPENCLIENT_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$OPENCLIENT_RESULTS"
          git rev-parse HEAD > "$OPENCLIENT_RESULTS/source-revision.txt"
          xcode-select -p
          xcodebuild -version | tee "$OPENCLIENT_RESULTS/xcode-version.txt"
          export OPENCLIENT_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          if xcode-select -p | grep -Eiq 'beta|release.?candidate|_RC'; then
            echo 'The selected Xcode is prerelease; no simulator tests ran.' >&2
            exit 1
          fi
          xcrun simctl list devices available --json > "$OPENCLIENT_RESULTS/simulators.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          devices = json.loads((Path(os.environ['OPENCLIENT_RESULTS']) / 'simulators.json').read_text())['devices']
          patterns = {'iphone': r'^iPhone ([0-9]+) Pro Max$', 'ipad': r'^iPad Pro 13-inch \(M([0-9]+)\)$'}
          sdk = tuple(map(int, os.environ['OPENCLIENT_SDK_VERSION'].split('.')[:2]))
          common = []
          for runtime, rows in devices.items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'[0-9]+', runtime)))
              if version[:2] > sdk:
                  continue
              models = {kind: [device for device in rows if device.get('isAvailable')
                        and re.fullmatch(pattern, device['name'])
                        and (kind != 'iphone' or int(re.fullmatch(pattern, device['name']).group(1)) >= 16)]
                        for kind, pattern in patterns.items()}
              if all(models.values()):
                  common.append((version, runtime, models))
          if not common:
              raise SystemExit('No supported common runtime for Pro Max and 13-inch iPad Pro; native tests were not run.')
          _, runtime, models = max(common, key=lambda item: item[0])
          kind = os.environ['OPENCLIENT_DEVICE_KIND']
          device = max(models[kind], key=lambda device: int(re.fullmatch(patterns[kind], device['name']).group(1)))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('OPENCLIENT_DESTINATION=platform=iOS Simulator,id=' + device['udid'] + '\n')
          print('Selected simulator:', runtime, device['name'], device['udid'])
          PY
      - name: Boot the selected simulator before starting XCTest
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          device_id="${OPENCLIENT_DESTINATION##*id=}"
          xcrun simctl bootstatus "$device_id" -b 2>&1 | tee "$OPENCLIENT_RESULTS/simulator-boot.log"
      - name: Measure one extreme session from navigation to usable chat
        timeout-minutes: 150
        shell: bash
        run: bash performance-lab/run-extreme-session.sh "$OPENCLIENT_DESTINATION" "$OPENCLIENT_RESULTS/extreme"
      - name: Export native hang and crash diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          results="${OPENCLIENT_RESULTS:-$RUNNER_TEMP/openclient-extreme-results}"
          mkdir -p "$results/diagnostics"
          if [[ -n "${OPENCLIENT_DESTINATION:-}" ]]; then
            device_id="${OPENCLIENT_DESTINATION##*id=}"
            probe_output="$results/diagnostics/interrupted-probes"
            mkdir -p "$probe_output"
            printf '%s\n' 'Best-effort partial snapshot of the current app probe files. May contain an incomplete JSONL tail or overlap an exported case; this is not proof of a completed measured trial.' \
              > "$probe_output/README.txt"
            container=$(xcrun simctl get_app_container "$device_id" com.ntoporcov.openclient data 2> "$probe_output/export.log" || true)
            if [[ -n "$container" && -d "$container/Documents/OpenClientExtremeSession" ]]; then
              ditto "$container/Documents/OpenClientExtremeSession" "$probe_output/app-documents" \
                >> "$probe_output/export.log" 2>&1 || true
            fi
            xcrun simctl spawn "$device_id" log show --style json --last 2h \
              --predicate 'subsystem == "com.ntoporcov.openclient" AND (category == "Hangs" OR category == "SessionSwitch")' \
              > "$results/diagnostics/app-hangs.json" 2> "$results/diagnostics/app-hangs-export.log" || true
          fi
          python3 - "$results" <<'PYTHON'
          from pathlib import Path
          import shutil, sys
          target = Path(sys.argv[1]) / 'diagnostics'
          source = Path.home() / 'Library/Logs/DiagnosticReports'
          for path in source.glob('*.ips'):
              if path.name.startswith(('OpenClient', 'OpenCodeIOSClient')):
                  shutil.copy2(path, target / path.name)
          PYTHON
      - name: Keep readable measurements and partial failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclient-extreme-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OPENCLIENT_RESULTS }}/*.json
            ${{ env.OPENCLIENT_RESULTS }}/*.log
            ${{ env.OPENCLIENT_RESULTS }}/*.txt
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.json
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.jsonl
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.log
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.txt
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.ips
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.png
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.jpg
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.jpeg
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.mp4
            ${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.mov
            ${{ env.OPENCLIENT_RESULTS }}/diagnostics/**
            !${{ env.OPENCLIENT_RESULTS }}/extreme/**/*.xcresult/**
          retention-days: 3
          if-no-files-found: warn
